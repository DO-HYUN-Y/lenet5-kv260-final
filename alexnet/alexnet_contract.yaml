pre_rtl_validation:
  status: pass
  dataset: ILSVRC2012_validation_calibration_disjoint_class_balanced
  image_count: 5000
  image_list: calibration/imagenet_disjoint_balanced_5000.txt
  image_list_sha256: 96f9623a099efd48bcd99c64ef2b8bb2c34ce9e91e659187010b9cb158306af4
  ordered_image_set_sha256: 50677ca17e6854d8253c7672ba38f18cfe2477533fd7ea9df8f7fda2934002f4
  fp32_top1_percent: 56.10
  fp32_top5_percent: 78.48
  int8_top1_percent: 55.66
  int8_top5_percent: 78.82
  top1_prediction_agreement_percent: 93.60
  accuracy_report_sha256: f08b2e34b3b530310449f4ef1061a567fd185ec49823c0593687ea2bbc616a9e
  profile_image_count: 1000
  profile_list: calibration/imagenet_profile_balanced_1000.txt
  profile_list_sha256: 5b4556d82105db697d500db8c2779a132ddd9c91d85df06778f2039ab0ce9393
  profile_report_sha256: 24f1fb8600c963cb5d9f7c1569a72e2ca595aff8132581227d8ab9cd632e1d7c

# 첫 INT8 C++/RTL operator golden의 산술 및 physical K-order 계약이다.
int8_operator_contract:
  status: operator_semantics_and_calibration_values_frozen
  activation: signed_int8
  weight: signed_int8
  zero_point: 0
  accumulator: signed_int32_checked_no_overflow
  bias: signed_int32_added_before_scale
  multiplier: signed_int18_non_negative
  multiplier_range: [65540, 131067]
  right_shift_range: [23, 32]
  post_bias_model_bound: signed_int27_for_every_possible_signed_int8_input
  product: signed_int45_exact_dsp48e2_27x18
  rounding: right_shift_round_half_away_from_zero
  relu: after_scaling_before_saturation
  output: signed_int8_saturate_minus128_to_127
  physical_k_order: [kernel_y, kernel_x, input_channel_in_group]
  weight_tile_order: [output_channel_tile, k, output_channel_lane]
  packed_pe: two_activation_lanes_times_one_common_weight_split_every_cycle

pre_rtl_architecture:
  board: kria_kv260_k26
  baseline_clock_mhz: 200
  logical_sa: {m: 32, n: 64}
  local_sa: {m: 8, n: 8, tile_count: 32}
  compute_dsp48e2: 1024
  postprocess:
    mapping: one_dsp_per_n_output_channel_scan_m32
    lanes: 64
    dsp48e2: 64
    full_tile_drain_cycles: 32
    n_tail_mask_supported: true
    ready_stall_holds_coordinate_and_data: true
    ready_domain: independent_per_n8_slice
    m_selector_pipeline: registered_m8_then_registered_m_group
    output_partition: eight_independent_n8_scanner_fifo_pool_slices
    output_width_per_slice_bits: 64
    parameter_residency: eight_channel_records_in_slice_local_registers_per_tile
  output_router:
    count: 8
    mapping: one_router_per_n8_postprocess_slice
    width_per_router_bits: 64
    aggregate_burst_width_bits: 512
    fifo_depth_packets_per_router: 64
    packet_payload_bytes: 8
    buffered_m32_tiles_per_router: 2
    total_payload_storage_bytes: 4096
    ready_domain: independent_per_router
    destinations: [pool3x3, activation_buffer, final_output]
    physical_layout: [n64_tile, n8_slice, m, n_lane]
    descriptor_change_requires_empty_fifo: true
    invalid_n_lanes_are_masked_and_zero: true
    scaling_rule: one_router_per_eight_parallel_postprocess_outputs
  total_dsp48e2_target: 1088
