# 첫 INT8 C++/RTL operator golden의 산술 및 physical K-order 계약이다.
int8_operator_contract:
  status: operator_semantics_and_calibration_values_frozen
  activation: signed_int8
  weight: signed_int8
  zero_point: 0
  accumulator: signed_int32_checked_no_overflow
  bias: signed_int32_added_before_scale
  multiplier: signed_int18_non_negative
  multiplier_range: [65540, 131067]
  right_shift_range: [23, 32]
  post_bias_model_bound: signed_int27_for_every_possible_signed_int8_input
  product: signed_int45_exact_dsp48e2_27x18
  rounding: right_shift_round_half_away_from_zero
  relu: after_scaling_before_saturation
  output: signed_int8_saturate_minus128_to_127
  physical_k_order: [kernel_y, kernel_x, input_channel_in_group]
  weight_tile_order: [output_channel_tile, k, output_channel_lane]
  packed_pe: two_activation_lanes_times_one_common_weight_split_every_cycle

