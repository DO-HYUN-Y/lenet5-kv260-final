# 이 파일은 Python, C++, RTL이 공통으로 따라야 할 AlexNet 실행 규격이다.
# YAML에서 # 뒤의 내용은 설명용 주석이며 프로그램 데이터에는 포함되지 않는다.
contract_version: 1

# 사용할 AlexNet 종류와 공식 checkpoint 정보
model:
  family: AlexNet
  variant: torchvision.models.alexnet
  weights: AlexNet_Weights.IMAGENET1K_V1
  checkpoint_url: https://download.pytorch.org/models/alexnet-owt-7be5be79.pth
  checkpoint_sha256: 7be5be791159472b1fbf3c69796f7cb30dca7ad8466c2df70058c37116cdee02
  class_count: 1000
  parameter_count: 61100840
  macs_per_image: 714188480
  ops_per_image_1mac_equals_2ops: 1428376960
  grouped_convolution: false

# 모델에 들어가는 tensor 한 장의 모양
# NCHW = batch 수, channel 수, 높이, 너비 순서
input:
  tensor_layout: NCHW
  shape: [1, 3, 224, 224]
  channel_order: RGB

# 원본 사진을 model 입력 tensor로 바꾸는 전처리 규칙
preprocess:
  resize_shorter_side: 256
  center_crop: [224, 224]
  interpolation: bilinear
  antialias: true
  scale_uint8_to_float: 0.00392156862745098
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

# 각 layer의 고정 파라미터와 예상 출력 shape
# Conv의 output은 batch 차원을 제외한 [channel, height, width]이다.
layers:
  conv1: {in_channels: 3, out_channels: 64, kernel: 11, stride: 4, padding: 2, groups: 1, output: [64, 55, 55]}
  pool1: {kernel: 3, stride: 2, padding: 0, output: [64, 27, 27]}
  conv2: {in_channels: 64, out_channels: 192, kernel: 5, stride: 1, padding: 2, groups: 1, output: [192, 27, 27]}
  pool2: {kernel: 3, stride: 2, padding: 0, output: [192, 13, 13]}
  conv3: {in_channels: 192, out_channels: 384, kernel: 3, stride: 1, padding: 1, groups: 1, output: [384, 13, 13]}
  conv4: {in_channels: 384, out_channels: 256, kernel: 3, stride: 1, padding: 1, groups: 1, output: [256, 13, 13]}
  conv5: {in_channels: 256, out_channels: 256, kernel: 3, stride: 1, padding: 1, groups: 1, output: [256, 13, 13]}
  pool5: {kernel: 3, stride: 2, padding: 0, output: [256, 6, 6]}
  fc6: {in_features: 9216, out_features: 4096}
  fc7: {in_features: 4096, out_features: 4096}
  fc8: {in_features: 4096, out_features: 1000}

# torchvision이 공개한 checkpoint 기준 정확도이며 아직 우리 실측값은 아니다.
reference_accuracy_percent:
  source: torchvision_weights_metadata
  imagenet1k_top1: 56.522
  imagenet1k_top5: 79.066

# ImageNet 50,000장 검증 상태
validation:
  dataset: ILSVRC2012 validation
  sample_count: 50000
  metric: [top1, top5]
  measured: false
  note: Actual accuracy must be recorded after the validation dataset is supplied.

# 저장소에서 실제로 실행해 통과한 빠른 구조 검증 결과
smoke_verification:
  cpu_runtime: {python: 3.12.10, torch: 2.13.0+cpu, torchvision: 0.28.0+cpu}
  cuda_runtime: {python: 3.12.10, torch: 2.13.0+cu126, torchvision: 0.28.0+cu126}
  cuda_device: NVIDIA GeForce RTX 3050 8GB
  architecture_matches_torchvision: true
  output_matches_torchvision_with_identical_state_dict: bit_exact
  pretrained_checkpoint_loaded: true
  cuda_smoke_test_passed: true

# 첫 INT8 C++/RTL operator golden의 산술 및 physical K-order 계약이다.
# 실제 layer별 multiplier/shift 값과 INT8 정확도는 calibration 후 추가한다.
int8_operator_contract:
  status: operator_semantics_frozen_calibration_values_pending
  activation: signed_int8
  weight: signed_int8
  zero_point: 0
  accumulator: signed_int32_checked_no_overflow
  bias: signed_int32_added_before_scale
  multiplier: signed_int32_non_negative
  rounding: right_shift_round_half_away_from_zero
  relu: after_scaling_before_saturation
  output: signed_int8_saturate_minus128_to_127
  physical_k_order: [kernel_y, kernel_x, input_channel_in_group]
  weight_tile_order: [output_channel_tile, k, output_channel_lane]
  packed_pe: two_activation_lanes_times_one_common_weight_split_every_cycle
